name: Refresh and deploy Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '20 0,6,12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh community prices
        id: refresh
        continue-on-error: true
        run: npm run refresh
      - name: Report unavailable sources
        if: steps.refresh.outcome == 'failure'
        run: echo '::warning::Refresh failed. Deploying the retained observations with their original dates and visible source status.'
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Preserve observations and refresh status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/prices.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh gold observations [skip ci]'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
